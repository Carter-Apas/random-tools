name: Publish Docker images

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Discover changed apps with Dockerfiles
        id: apps
        env:
          GIT_BEFORE: ${{ github.event.before }}
          GIT_AFTER: ${{ github.sha }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          apps = sorted(path.parent.name for path in Path(".").glob("*/Dockerfile"))
          if not apps:
              raise SystemExit("No */Dockerfile found")
          for app in apps:
              if not re.fullmatch(r"[a-z0-9]+(?:[._-][a-z0-9]+)*", app):
                  raise SystemExit(f"App folder is not a valid image name: {app}")
          before = os.environ["GIT_BEFORE"]
          if before and set(before) != {"0"}:
              history_available = subprocess.run(
                  ["git", "cat-file", "-e", before + "^{commit}"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              ).returncode == 0
              if history_available:
                  changed = subprocess.check_output([
                      "git", "diff", "--name-only", "--no-renames", "-z",
                      before, os.environ["GIT_AFTER"],
                  ]).decode("utf-8", errors="surrogateescape").split("\0")
                  if ".github/workflows/docker.yml" not in changed:
                      changed_folders = {path.split("/", 1)[0] for path in changed if "/" in path}
                      apps = [app for app in apps if app in changed_folders]
              else:
                  print("Previous commit unavailable; rebuilding all apps.", file=sys.stderr)
          print("Selected apps: " + json.dumps(apps), file=sys.stderr)
          print("apps=" + json.dumps(apps))
          PY

  publish:
    needs: discover
    if: needs.discover.outputs.apps != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.apps) }}
    name: Publish ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - name: Set image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          APP: ${{ matrix.app }}
        run: echo "name=ghcr.io/${OWNER,,}/$APP" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push latest
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.app }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.app }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
